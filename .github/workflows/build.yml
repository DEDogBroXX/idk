name: Build SM64 Android Port

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装编译 C++ 必须的基础库
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 libsdl2-dev libglew-dev libgl1-mesa-dev

      # 安装 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 直接使用官方预装好的 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 编译 C++ 引擎（这一步会检查你上传的 baserom.us.z64）
      - name: Build Native Code
        run: |
          cd app/jni
          make PLATFORM=ANDROID ARCH=arm64

      # 打包成 APK
      - name: Build APK
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleRelease

      # 上传结果
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-release
          path: app/build/outputs/apk/release/app-release.apk
