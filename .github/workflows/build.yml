name: Build SM64 Android Port

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 libsdl2-dev libglew-dev libgl1-mesa-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 关键步骤：把 ROM 文件复制到编译需要的位置
      - name: Prepare ROM
        run: |
          cp app/jni/src/baserom.us.z64 app/jni/baserom.us.z64

      # 去正确的目录开始编译 C++ 引擎
      - name: Build Native Code
        run: |
          cd app/jni
          make PLATFORM=ANDROID ARCH=arm64

      # 打包成 APK
      - name: Build APK
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleRelease

      # 上传结果
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-release
          path: app/build/outputs/apk/release/app-release.apk
